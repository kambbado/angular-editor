<span class="ae-picker" [class.ae-expanded]="isOpen">
  <button #labelButton tabindex="-1" type="button" role="button" class="ae-picker-label"
    (click)="toggleOpen($event);">{{label}}
    <svg>
      <use [attr.href]="'assets/ae-icons/icons.svg#sort'" [attr.xlink:href]="'assets/ae-icons/icons.svg#sort'"></use>
    </svg>
  </button>
  <span class="ae-picker-options">
    @for (item of options(); track item.label; let i = $index) {
    <span type="button" role="button" class="ae-picker-item"
      [class]="{'selected': item.value === value, 'focused': i === optionId}"
      (mousedown)="optionSelect(item, $event)">
      {{item.label}}
    </span>
    }
    @if (!options().length) {
    <span class="dropdown-item">No items for select</span>
    }
  </span>
</span>
